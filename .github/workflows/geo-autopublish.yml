name: Auto Publish SEO/GEO Matrix Articles

on:
  schedule:
    # 每 4 天在 UTC 02:00（北京时间 10:00）自动执行
    - cron: '0 2 */4 * *'
  workflow_dispatch:
    inputs:
      topic:
        description: '指定特定主题/关键词（留空则从矩阵池自动按序发布）'
        required: false
        type: string
      collection:
        description: '指定发布栏目（留空则根据主题自动匹配）'
        required: false
        type: choice
        options:
          - ''
          - protocol
          - tutorial
          - tools
          - risk
          - airport

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 pnpm 包管理器
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 配置 Node.js 运行环境
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 安装项目依赖
        run: pnpm install --frozen-lockfile

      - name: 启动 GEO 万字级专题自动化生成引擎
        id: autopublish
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TOPIC_OVERRIDE: ${{ github.event.inputs.topic }}
          COLLECTION_OVERRIDE: ${{ github.event.inputs.collection }}
        run: |
          node scripts/geo-autopublish.mjs

      - name: 严格内容合规与语法校验
        run: |
          pnpm lint:content
          pnpm check

      - name: 提交并推送到 GitHub (触发 Cloudflare Pages 构建发布)
        run: |
          # 检查工作区是否有新生成的文件变动
          if [ -z "$(git status --porcelain)" ]; then
            echo "未检测到新文件生成，跳过提交。"
            exit 0
          fi

          # 提取最新文章标题作为清晰的 Commit 信息
          ARTICLE_TITLE="深度技术专题"
          if [ -f .last_published_meta.txt ]; then
            ARTICLE_TITLE=$(cat .last_published_meta.txt)
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add src/content/ scripts/geo-matrix-pool.json
          
          # 注意：根据核心配置规范，严格杜绝 [skip ci]，确保每一次发布都能正常触发 Cloudflare Pages / CI 自动构建上线
          git commit -m "feat(content): publish weekly authoritative geo dossier on ${ARTICLE_TITLE}"
          
          git push origin main
